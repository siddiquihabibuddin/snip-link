spring:
  application:
    name: sniplink

server:
  port: 8080

app:
  # Public base URL of this service, used to build shortUrl values in responses.
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    # Comma-separated list of allowed browser origins for /api/**.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
