name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per branch/PR; newer pushes cancel older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write          # dorny/test-reporter publishes a check run
  pull-requests: write

jobs:
  # Detect which part of the monorepo changed so we can skip irrelevant jobs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']   # current LTS + latest, to catch forward-compat breakage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build & test
        working-directory: backend
        run: ./mvnw -B verify
      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && matrix.java == '21' }}
        with:
          name: backend tests
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit
      - name: Upload coverage (JaCoCo)
        if: ${{ !cancelled() && matrix.java == '21' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: warn

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # Build the backend image on every PR (no push) to prove the Dockerfile is valid
  # and to warm the layer cache that the CD workflow reuses.
  docker-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: sniplink-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stable required-status target for branch protection: always runs, and fails
  # if any real job failed. Path-filtered jobs that are skipped count as "passed".
  ci-ok:
    if: always()
    needs: [backend, frontend, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} docker=${{ needs.docker-build.result }}"
          for r in "${{ needs.backend.result }}" "${{ needs.frontend.result }}" "${{ needs.docker-build.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job did not pass"
              exit 1
            fi
          done
