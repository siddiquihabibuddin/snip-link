name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual re-deploys

# Never run two deploys at once; do not cancel an in-flight deploy.
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read
  packages: write        # push image to GitHub Container Registry

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    needs: image
    runs-on: ubuntu-latest
    # Manual-approval gate + deployment tracking. Configure a required reviewer on
    # the "production" environment in repo Settings > Environments.
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" > /dev/null
      - name: Smoke test - wait for /actuator/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.BACKEND_URL }}/actuator/health" | grep -q '"status":"UP"'; then
              echo "backend healthy after ${i} attempt(s)"; exit 0
            fi
            echo "attempt ${i}: not ready, retrying in 10s"; sleep 10
          done
          echo "::error::backend did not become healthy in time"; exit 1

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build with production API base
        run: npm run build
        env:
          VITE_API_BASE: ${{ vars.BACKEND_URL }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=snip-link --branch=main
      - name: Smoke test - frontend responds
        run: curl -fsS -o /dev/null -w "%{http_code}\n" "${{ vars.FRONTEND_URL }}"
